name: zolo-gitwal

x-storage: &storage
  GITWAL_S3_ENDPOINT: http://rustfs:9000
  GITWAL_S3_BUCKET: ${GITWAL_S3_BUCKET:-gitwal}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-gitwal-local}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-gitwal-local-development-secret}

services:
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-gitwal-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-gitwal-local-development-secret}
      RUSTFS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${GITWAL_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_S3_PORT:-9000}:9000"
      - "${GITWAL_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  storage-init:
    build:
      context: .
      dockerfile: docker/storage-init.Dockerfile
    image: zolo-gitwal-storage-init:local
    environment: *storage
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  gitwal:
    platform: linux/amd64
    build: &gitwal-build
      context: .
      target: runtime
      platforms: ["linux/amd64"]
    image: zolo-gitwal:local
    init: true
    restart: unless-stopped
    environment: &gitwal-environment
      <<: *storage
      GITWAL_DATA: /var/lib/gitwal
      GITWAL_WORKERS: ${GITWAL_WORKERS:-2}
      GITWAL_OBJECT_FORMAT: ${GITWAL_OBJECT_FORMAT:-sha1}
      GITWAL_COMPACT_AFTER: ${GITWAL_COMPACT_AFTER:-32}
      GITWAL_MAX_PUSH_BYTES: ${GITWAL_MAX_PUSH_BYTES:-1073741824}
      GITWAL_MAX_FETCH_BYTES: ${GITWAL_MAX_FETCH_BYTES:-10737418240}
      GITWAL_MULTIPART_THRESHOLD: ${GITWAL_MULTIPART_THRESHOLD:-67108864}
      GITWAL_CACHE_BYTES: ${GITWAL_CACHE_BYTES:-10737418240}
      GITWAL_CACHE_IDLE_SECONDS: ${GITWAL_CACHE_IDLE_SECONDS:-1800}
    ports:
      - "${GITWAL_BIND_ADDRESS:-127.0.0.1}:${GITWAL_HTTP_PORT:-8080}:8080"
    volumes:
      - gitwal-cache:/var/lib/gitwal
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  smoke:
    profiles: ["test"]
    platform: linux/amd64
    image: zolo-gitwal-tests:local
    build:
      <<: *gitwal-build
      target: tests
    environment:
      <<: *storage
      GITWAL_TEST_URL: http://gitwal:8080
      GITWAL_TEST_OBJECT_FORMAT: ${GITWAL_OBJECT_FORMAT:-sha1}
      GITWAL_OBJECT_FORMAT: ${GITWAL_OBJECT_FORMAT:-sha1}
    volumes:
      - smoke-state:/state
    depends_on:
      gitwal:
        condition: service_healthy

  unit:
    profiles: ["test"]
    platform: linux/amd64
    image: zolo-gitwal-development:local
    build:
      <<: *gitwal-build
      target: development
    network_mode: none

  ssh:
    platform: linux/amd64
    profiles: ["ssh"]
    build:
      <<: *gitwal-build
      target: ssh
    image: zolo-gitwal-ssh:local
    init: true
    restart: unless-stopped
    environment:
      <<: *gitwal-environment
      GITWAL_SSH_PUBLIC_KEY: ${GITWAL_SSH_PUBLIC_KEY:-}
      GITWAL_SSH_TOKEN: ${GITWAL_SSH_TOKEN:-}
    ports:
      - "${GITWAL_BIND_ADDRESS:-127.0.0.1}:${GITWAL_SSH_PORT:-2222}:2222"
    volumes:
      - gitwal-cache:/var/lib/gitwal
      - ssh-host-keys:/etc/ssh/host-keys
    tmpfs: ["/run:mode=0755", "/tmp:mode=1777"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 2222 127.0.0.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rustfs-data:
  gitwal-cache:
  smoke-state:
  ssh-host-keys:
